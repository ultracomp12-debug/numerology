  <!-- FIREBASE & APPLICATION SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Global variables provided by environment or defaults
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'numerology-calculator-app';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
      apiKey: "demo-api-key",
      authDomain: "demo.firebaseapp.com",
      projectId: "demo-project",
      storageBucket: "demo.appspot.com",
      messagingSenderId: "000000000",
      appId: "1:000000000:web:000000000"
    };
    const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

    let db = null;
    let auth = null;
    let currentUser = null;

    // --- ALPHABET DEFINITIONS & CONSTANTS ---
    const ALPHABETS = {
      ru: "АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ",
      en: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
      uk: "АБВГҐДЕЄЖЗИІЇЙКЛМНОПРСТУФХЦЧШЩЬЮЯ"
    };

    const MONTH_MAP_RU = {
      "январь": 1, "февраль": 2, "март": 3, "апрель": 4, "май": 5, "июнь": 6,
      "июль": 7, "август": 8, "сентябрь": 9, "октябрь": 10, "ноябрь": 11, "декабрь": 12
    };

    const MONTH_NAMES_ARRAY = [
      "", "январь", "февраль", "март", "апрель", "май", "июнь",
      "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"
    ];

    // Default predefined profile: Екатеринa
    const DEFAULT_PROFILES = [
      {
        id: "profile_ekaterina_default",
        nameTag: "Екатерина (Эталон 16.06.1992)",
        nameRu: "Екатерина",
        nameEn: "",
        nameUk: "",
        birthDate: "1992-06-16",
        calcDate: "2026-11-20",
        yearM3: 2026,
        yearM5: "2026-06-16",
        monthS3: 2026,
        monthU3: 11,
        dayX3: 2026,
        dayX4: "ноябрь",
        dayZ3: "1992-06-16",
        updatedAt: new Date().toISOString()
      }
    ];

    let activeTab = "karma";

    // --- TOAST UI NOTIFIER ---
    function showToast(message, type = "info") {
      const container = document.getElementById("toast-container");
      if (!container) return;
      const toast = document.createElement("div");
      const icon = type === "success" ? "fa-circle-check text-emerald-400" : "fa-circle-info text-amber-400";
      toast.className = `pointer-events-auto flex items-center space-x-3 px-4 py-3 rounded-xl bg-slate-900 text-white shadow-xl text-sm border border-slate-800 transition-all transform duration-300 opacity-0 translate-y-2`;
      toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i><span>${message}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.remove("opacity-0", "translate-y-2");
      }, 10);

      setTimeout(() => {
        toast.classList.add("opacity-0", "translate-y-2");
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // --- HELPER MATHEMATICAL FUNCTIONS ---
    function parseDateObj(isoStr) {
      if (!isoStr) return null;
      const parts = isoStr.split("-");
      if (parts.length !== 3) return null;
      const y = Number(parts[0]);
      const m = Number(parts[1]);
      const d = Number(parts[2]);
      if (!y || !m || !d) return null;
      const dt = new Date(Date.UTC(y, m - 1, d));
      return { year: y, month: m, day: d, dateObj: dt };
    }

    function formatIsoDate(dt) {
      const y = dt.getUTCFullYear();
      const m = String(dt.getUTCMonth() + 1).padStart(2, '0');
      const d = String(dt.getUTCDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatDisplayDate(dtObj) {
      if (!dtObj) return "—";
      const dd = String(dtObj.day).padStart(2, "0");
      const mm = String(dtObj.month).padStart(2, "0");
      return `${dd}.${mm}.${dtObj.year}`;
    }

    function daysInMonthUTC(year, month) {
      return new Date(Date.UTC(year, month, 0)).getUTCDate();
    }

    function sumDigits(num) {
      return String(Math.abs(Math.trunc(num)))
        .split("")
        .reduce((acc, ch) => acc + (/\d/.test(ch) ? Number(ch) : 0), 0);
    }

    function cap22(num) {
      const n = Number(num) || 0;
      return n > 22 ? n - 22 : n;
    }

    function mod22Plus1(val) {
      const n = Number(val) || 0;
      return (((n - 1) % 22) + 22) % 22 + 1;
    }

    function cycle1To22(val) {
      const n = Number(val) || 0;
      if (n === 0) return 22;
      const m = ((n % 22) + 22) % 22;
      return m === 0 ? 22 : m;
    }

    function calcAlphabetSum(text, alphabetStr) {
      if (!text) return 0;
      const upper = String(text).toUpperCase();
      let sum = 0;
      for (const ch of upper) {
        const idx = alphabetStr.indexOf(ch) + 1;
        if (idx > 0) {
          sum += ((idx - 1) % 9) + 1;
        }
      }
      return sum;
    }

    function calcAgeYears(birthObj, currentObj) {
      if (!birthObj || !currentObj) return 0;
      let age = currentObj.year - birthObj.year;
      if (
        currentObj.month < birthObj.month ||
        (currentObj.month === birthObj.month && currentObj.day < birthObj.day)
      ) {
        age -= 1;
      }
      return Math.max(0, age);
    }

    function calcSignByAge(val, age) {
      const v = Number(val) || 0;
      if (v === 0) return "+";
      if (age <= v) return "+";
      const step = Math.floor((age - v - 1) / v) + 1;
      return step % 2 === 0 ? "+" : "-";
    }

    // --- CORE NUMEROLOGY CALCULATIONS (NUM.XLSX EXPLICIT FORMULAS) ---
    function calculateFullNumerology(inputs) {
      const b = parseDateObj(inputs.birthDate) || { year: 1992, month: 6, day: 16 };
      const c = parseDateObj(inputs.calcDate) || { year: 2026, month: 11, day: 20 };
      
      const yearM3 = Number(inputs.yearM3) || 2026;
      const yearM5Obj = parseDateObj(inputs.yearM5) || { year: 2026, month: 6, day: 16 };
      const monthS3 = Number(inputs.monthS3) || 2026;
      const monthU3 = Number(inputs.monthU3) || 11;
      const dayX3 = Number(inputs.dayX3) || 2026;
      const dayX4Str = (inputs.dayX4 || "ноябрь").toLowerCase();
      const dayZ3Obj = parseDateObj(inputs.dayZ3) || { year: 1992, month: 6, day: 16 };

      // 1. Блок «Карма» (B4:C14)
      const c5DateDt = b.day > 22 ? b.day - 22 : b.day;
      const c6MonthMt = b.month;
      const yearDigitSumB = sumDigits(b.year);
      const c7YearGt = cap22(yearDigitSumB);

      const c8Opv1 = Math.abs(c6MonthMt - c5DateDt) === 0 ? 22 : Math.abs(c6MonthMt - c5DateDt);
      const c9Opv2 = Math.abs(c5DateDt - c7YearGt) === 0 ? 22 : Math.abs(c5DateDt - c7YearGt);
      const c10Opv3 = Math.abs(c8Opv1 - c9Opv2) === 0 ? 22 : Math.abs(c8Opv1 - c9Opv2);
      const c11Opv4 = Math.abs(c6MonthMt - c7YearGt) === 0 ? 22 : Math.abs(c6MonthMt - c7YearGt);
      const c12Gchk1 = cycle1To22(c8Opv1 + c9Opv2 + c10Opv3 + c11Opv4);
      const c13Opv6 = b.day >= 14 && b.day <= 22 ? c5DateDt : "-";
      const c14Gchk2 = c13Opv6 === "-" ? "-" : cycle1To22(c12Gchk1 + Number(c13Opv6));

      // Minus-Arcana List ($C$8:$C$14)
      const minusSet = new Set(
        [c8Opv1, c9Opv2, c10Opv3, c11Opv4, c12Gchk1, c13Opv6, c14Gchk2]
          .filter((x) => typeof x === "number" && !Number.isNaN(x))
      );

      const getMinusPlusSign = (val) => minusSet.has(val) ? "-" : "+";

      // 2. Блок «Тень Кармы» (H4:I20)
      const sumRu = calcAlphabetSum(inputs.nameRu, ALPHABETS.ru);
      const sumEn = calcAlphabetSum(inputs.nameEn, ALPHABETS.en);
      const sumUk = calcAlphabetSum(inputs.nameUk, ALPHABETS.uk);
      const totalLettersSum = sumRu + sumEn + sumUk;
      const nameArcana = totalLettersSum === 0 ? 0 : mod22Plus1(totalLettersSum);

      const age = calcAgeYears(b, c);
      const opv1Shadow = Math.abs(b.month - b.day);
      const signOpv1 = calcSignByAge(opv1Shadow, age);
      const dt14To22 = b.day >= 14 && b.day <= 22 ? b.day : 0;
      const signDt = calcSignByAge(dt14To22, age);
      const totalSign = (signOpv1 === "+" && signDt === "+") ? "+" : "-";
      const shadowResult = `${nameArcana}${totalSign}`;

      const o8SignedArcana = nameArcana * (totalSign === "-" ? -1 : 1);
      const o20SignedShadow = nameArcana * (totalSign === "-" ? -1 : 1);

      // Helper for Base Date Forecast Parts (ZSH & TSH)
      function dateForecastParts(dtObj) {
        const d1To8 =
          Math.floor(dtObj.day / 10) + (dtObj.day % 10) +
          Math.floor(dtObj.month / 10) + (dtObj.month % 10) +
          Math.floor(dtObj.year / 1000) + (Math.floor(dtObj.year / 100) % 10) +
          (Math.floor(dtObj.year / 10) % 10) + (dtObj.year % 10);
        const zshNum = cap22(d1To8);

        const yearSum4 =
          Math.floor(dtObj.year / 1000) + (Math.floor(dtObj.year / 100) % 10) +
          (Math.floor(dtObj.year / 10) % 10) + (dtObj.year % 10);
        const yearPart = cap22(yearSum4);
        const dayPart = dtObj.day > 22 ? dtObj.day - 22 : dtObj.day;
        const tshRaw = dayPart + dtObj.month + yearPart;
        const tshNum = cap22(tshRaw);

        const isMinus = minusSet.has(zshNum) || minusSet.has(tshNum);
        const sign = isMinus ? "-" : "+";
        return { zshNum, tshNum, zsh: `${zshNum}${sign}`, tsh: `${tshNum}${sign}` };
      }

      function calcDerivedYearMonth(baseNum) {
        const val = mod22Plus1(Math.abs(baseNum + o20SignedShadow + o8SignedArcana));
        return `${val}${getMinusPlusSign(val)}`;
      }

      // 3. Блок «Прогностика года» (L3:N9)
      const yearEndDt = new Date(Date.UTC(yearM5Obj.year + 1, yearM5Obj.month - 1, yearM5Obj.day - 1));
      const yearEndObj = {
        year: yearEndDt.getUTCFullYear(),
        month: yearEndDt.getUTCMonth() + 1,
        day: yearEndDt.getUTCDate()
      };
      const periodLabel = `${formatDisplayDate(yearM5Obj)} по ${formatDisplayDate(yearEndObj)}`;
      
      const yearParts = dateForecastParts(yearM5Obj);
      const yearZsh = yearParts.zsh;
      const yearTsh = yearParts.tsh;
      const yearTzsh = calcDerivedYearMonth(yearParts.zshNum);
      const yearTtsh = calcDerivedYearMonth(yearParts.tshNum);

      // 4. Блок «Прогностика месяца» (R3:U8)
      const clampedBirthDay = Math.min(b.day, daysInMonthUTC(monthS3, monthU3));
      const monthCalcDateObj = { year: monthS3, month: monthU3, day: clampedBirthDay };
      const monthParts = dateForecastParts(monthCalcDateObj);
      const monthZsh = monthParts.zsh;
      const monthTsh = monthParts.tsh;
      const monthTzsh = calcDerivedYearMonth(monthParts.zshNum);
      const monthTtsh = calcDerivedYearMonth(monthParts.tshNum);

      // 5. Блок «Прогностика на день» (W3:BB11)
      const forecastMonthNum = MONTH_MAP_RU[dayX4Str] || 11;
      const dimForecast = daysInMonthUTC(dayX3, forecastMonthNum);
      const z3Day = dayZ3Obj.day;
      const dayZ3InMonth = z3Day > dimForecast ? z3Day - dimForecast : z3Day;

      const dailyItems = [];
      for (let d = 1; d <= 31; d++) {
        if (d > dimForecast) {
          dailyItems.push({ day: d, calcDateStr: "—", zsh: "—", tsh: "—", tzsh: "—", ttsh: "—" });
          continue;
        }

        const shiftedDay = (dayZ3InMonth + d) > dimForecast ? (dayZ3InMonth + d) - dimForecast : (dayZ3InMonth + d);
        const dayCalcDateObj = { year: dayX3, month: forecastMonthNum, day: shiftedDay };
        const dParts = dateForecastParts(dayCalcDateObj);

        // Daily derived TZSH & TTSH:
        const tzNum = cycle1To22(Math.abs(dParts.zshNum + o8SignedArcana));
        const ttNum = cycle1To22(Math.abs(dParts.tshNum + o8SignedArcana));

        dailyItems.push({
          day: d,
          calcDateStr: formatDisplayDate(dayCalcDateObj),
          zsh: dParts.zsh,
          tsh: dParts.tsh,
          tzsh: `${tzNum}${getMinusPlusSign(tzNum)}`,
          ttsh: `${ttNum}${getMinusPlusSign(ttNum)}`
        });
      }

      // 6. Блок «Талант» (C19:C27)
      const c19Obj = b;
      const c20DateDt = c19Obj.day > 22 ? c19Obj.day - 22 : c19Obj.day;
      const c21MonthMt = c19Obj.month;
      const c22YearGt = cap22(sumDigits(c19Obj.year));

      function makeTalentArcana(rawSum) {
        const val = rawSum > 22 ? rawSum - 22 : rawSum;
        return `${val}${getMinusPlusSign(val)}`;
      }

      const tch1 = makeTalentArcana(Math.abs(c21MonthMt + c20DateDt));
      const tch2 = makeTalentArcana(Math.abs(c20DateDt + c22YearGt));
      const tch1Num = Number(tch1.replace(/[+-]/g, ''));
      const tch2Num = Number(tch2.replace(/[+-]/g, ''));
      const tch3 = makeTalentArcana(Math.abs(tch1Num + tch2Num));
      const tch4 = makeTalentArcana(Math.abs(c21MonthMt + c22YearGt));

      const tch3Num = Number(tch3.replace(/[+-]/g, ''));
      const tch4Num = Number(tch4.replace(/[+-]/g, ''));
      const sumTchAll = tch1Num + tch2Num + tch3Num + tch4Num;
      const gtch1Num = cycle1To22(sumTchAll);
      const gtch1 = `${gtch1Num}${getMinusPlusSign(gtch1Num)}`;

      return {
        karma: {
          birthDateStr: formatDisplayDate(b),
          c5DateDt, c6MonthMt, c7YearGt,
          c8Opv1, c9Opv2, c10Opv3, c11Opv4,
          c12Gchk1, c13Opv6, c14Gchk2,
          minusList: Array.from(minusSet).sort((x, y) => x - y)
        },
        shadow: {
          nameRu: inputs.nameRu || "—",
          nameEn: inputs.nameEn || "—",
          nameUk: inputs.nameUk || "—",
          sumRu, sumEn, sumUk, totalLettersSum,
          nameArcana,
          birthDateStr: formatDisplayDate(b),
          calcDateStr: formatDisplayDate(c),
          age, opv1Shadow, signOpv1, dt14To22, signDt, totalSign,
          result: shadowResult
        },
        talent: {
          c20DateDt, c21MonthMt, c22YearGt,
          tch1, tch2, tch3, tch4, gtch1
        },
        year: {
          yearM3,
          period: periodLabel,
          metrics: [
            { label: "ЗШ", value: yearZsh },
            { label: "ТШ", value: yearTsh },
            { label: "ТЗШ", value: yearTzsh },
            { label: "ТТШ", value: yearTtsh }
          ]
        },
        month: {
          year: monthS3,
          month: monthU3,
          calcDateStr: formatDisplayDate(monthCalcDateObj),
          metrics: [
            { label: "ЗШ", value: monthZsh },
            { label: "ТШ", value: monthTsh },
            { label: "ТЗШ", value: monthTzsh },
            { label: "ТТШ", value: monthTtsh }
          ]
        },
        dayForecast: {
          year: dayX3,
          monthName: dayX4Str,
          items: dailyItems
        }
      };
    }

                <div class="text-xs text-slate-500">Опв1 [I15] / Знак [I16]</div>
                <div class="flex items-center space-x-2 mt-1">
                  <span class="text-xl font-bold text-slate-800">${s.opv1Shadow}</span>
                  <span class="px-2 py-0.5 text-xs font-bold rounded ${s.signOpv1 === '+' ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}">${s.signOpv1}</span>
                </div>
              </div>
              <div class="p-4 bg-slate-50 rounded-xl border border-slate-100">
                <div class="text-xs text-slate-500">Дт (14-22) [I17] / Знак [I18]</div>
                <div class="flex items-center space-x-2 mt-1">
                  <span class="text-xl font-bold text-slate-800">${s.dt14To22}</span>
                  <span class="px-2 py-0.5 text-xs font-bold rounded ${s.signDt === '+' ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}">${s.signDt}</span>
                </div>
              </div>
              <div class="p-4 bg-slate-900 text-white rounded-xl shadow-md">
                <div class="text-xs text-amber-400 font-bold">РЕЗУЛЬТАТ [I20]</div>
                <div class="text-2xl font-black text-white mt-1">${s.result}</div>
                <div class="text-xs text-slate-400 mt-1">Итого знак [I19]: <span class="font-bold text-amber-300">${s.totalSign}</span></div>
              </div>
            </div>
          </div>
        `;
      } else if (activeTab === "year") {
        const y = res.year;
        container.innerHTML = `
          <div class="panel-card bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-6">
            <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-slate-100">
              <div>
                <h3 class="font-bold text-slate-900 text-lg">Прогностика года (${y.yearM3})</h3>
                <p class="text-xs text-slate-500">Период действия: <span class="font-semibold text-slate-700">${y.period}</span></p>
              </div>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
              ${y.metrics.map(m => `
                <div class="p-5 bg-slate-50 rounded-2xl border border-slate-100 text-center space-y-2">
                  <div class="text-xs font-bold text-slate-500 tracking-wider uppercase">${m.label}</div>
                  <div class="text-2xl sm:text-3xl font-black">${getSignBadge(m.value)}</div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } else if (activeTab === "month") {
        const m = res.month;
        container.innerHTML = `
          <div class="panel-card bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-6">
            <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-slate-100">
              <div>
                <h3 class="font-bold text-slate-900 text-lg">Прогностика месяца (${m.month}.${m.year})</h3>
                <p class="text-xs text-slate-500">Дата расчёта [U4]: <span class="font-semibold text-slate-700">${m.calcDateStr}</span></p>
              </div>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
              ${m.metrics.map(metric => `
                <div class="p-5 bg-slate-50 rounded-2xl border border-slate-100 text-center space-y-2">
                  <div class="text-xs font-bold text-slate-500 tracking-wider uppercase">${metric.label}</div>
                  <div class="text-2xl sm:text-3xl font-black">${getSignBadge(metric.value)}</div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } else if (activeTab === "day") {
        const dF = res.dayForecast;
        container.innerHTML = `
          <div class="panel-card bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-slate-100">
              <div>
                <h3 class="font-bold text-slate-900 text-lg">Прогностика на день (${dF.monthName} ${dF.year})</h3>
                <p class="text-xs text-slate-500">Горизонтальная таблица всех дней месяца (1..31)</p>
              </div>
            </div>

            <!-- TABLE -->
            <div class="table-scroll overflow-x-auto rounded-xl border border-slate-200 shadow-inner">
              <table class="w-full text-center text-xs whitespace-nowrap">
                <thead>
                  <tr class="bg-slate-900 text-white">
                    <th class="px-3 py-2.5 font-bold sticky left-0 z-10 bg-slate-900 border-r border-slate-700">Показатель</th>
                    ${dF.items.map(item => `<th class="px-2.5 py-2.5 font-semibold border-r border-slate-800 ${item.calcDateStr === '—' ? 'text-slate-600' : ''}">${item.day}</th>`).join('')}
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-200 bg-white">
                  <!-- Row 1: Calc Date -->
                  <tr class="bg-slate-50/70">
                    <td class="px-3 py-2 font-bold text-slate-700 sticky left-0 z-10 bg-slate-100 border-r border-slate-200 text-left">Дата расчета</td>
                    ${dF.items.map(item => `<td class="px-2 py-2 text-[11px] text-slate-500 border-r border-slate-100">${item.calcDateStr}</td>`).join('')}
                  </tr>
                  <!-- Row 2: ZSH -->
                  <tr>
                    <td class="px-3 py-2 font-bold text-slate-800 sticky left-0 z-10 bg-white border-r border-slate-200 text-left">ЗШ</td>
                    ${dF.items.map(item => `<td class="px-2 py-2 border-r border-slate-100">${getSignBadge(item.zsh)}</td>`).join('')}
                  </tr>
                  <!-- Row 3: TSH -->
                  <tr>
                    <td class="px-3 py-2 font-bold text-slate-800 sticky left-0 z-10 bg-white border-r border-slate-200 text-left">ТШ</td>
                    ${dF.items.map(item => `<td class="px-2 py-2 border-r border-slate-100">${getSignBadge(item.tsh)}</td>`).join('')}
                  </tr>
                  <!-- Row 4: TZSH -->
                  <tr>
                    <td class="px-3 py-2 font-bold text-slate-800 sticky left-0 z-10 bg-white border-r border-slate-200 text-left">ТЗШ</td>
                    ${dF.items.map(item => `<td class="px-2 py-2 border-r border-slate-100">${getSignBadge(item.tzsh)}</td>`).join('')}
                  </tr>
                  <!-- Row 5: TTSH -->
                  <tr>
                    <td class="px-3 py-2 font-bold text-slate-800 sticky left-0 z-10 bg-white border-r border-slate-200 text-left">ТТШ</td>
                    ${dF.items.map(item => `<td class="px-2 py-2 border-r border-slate-100">${getSignBadge(item.ttsh)}</td>`).join('')}
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        `;
      }
    }

    // --- PROFILES STORAGE ENGINE (FIREBASE + LOCALSTORAGE FALLBACK) ---
    function getStoredProfilesLocal() {
      try {
        const raw = localStorage.getItem("numer_saved_profiles_v3");
        if (raw) return JSON.parse(raw);
      } catch (e) {
        console.warn("LocalStorage read error", e);
      }
      return DEFAULT_PROFILES;
    }

    function setStoredProfilesLocal(list) {
      try {
        localStorage.setItem("numer_saved_profiles_v3", JSON.stringify(list));
      } catch (e) {
        console.warn("LocalStorage write error", e);
      }
    }

    async function loadAllProfiles() {
      let profiles = getStoredProfilesLocal();
      if (db && currentUser) {
        try {
          const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'saved_profiles');
          const snapshot = await getDocs(colRef);
          if (!snapshot.empty) {
            const remoteList = [];
            snapshot.forEach(docSnap => remoteList.push(docSnap.data()));
            if (remoteList.length > 0) {
              profiles = remoteList;
              setStoredProfilesLocal(profiles);
            }
          }
        } catch (err) {
          console.warn("Firestore fetch warning, using local profiles:", err);
        }
      }
      updateProfilesUI(profiles);
    }

    async function saveProfileRecord(profile) {
      let profiles = getStoredProfilesLocal();
      const existingIdx = profiles.findIndex(p => p.id === profile.id);
      if (existingIdx >= 0) {
        profiles[existingIdx] = profile;
      } else {
        profiles.unshift(profile);
      }
      setStoredProfilesLocal(profiles);

      if (db && currentUser) {
        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'saved_profiles', profile.id);
          await setDoc(docRef, profile);
        } catch (err) {
          console.warn("Firestore save warning:", err);
        }
      }
      loadAllProfiles();
      showToast(`Профиль «${profile.nameTag}» сохранён!`, "success");
    }

    async function deleteProfileRecord(id) {
      let profiles = getStoredProfilesLocal().filter(p => p.id !== id);
      setStoredProfilesLocal(profiles);

      if (db && currentUser) {
        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'saved_profiles', id);
          await deleteDoc(docRef);
        } catch (err) {
          console.warn("Firestore delete warning:", err);
        }
      }
      loadAllProfiles();
      showToast("Профиль удалён", "info");
    }

    function updateProfilesUI(profiles) {
      const badge = document.getElementById("profiles-count-badge");
      if (badge) badge.textContent = profiles.length;

      const container = document.getElementById("profiles-list-container");
      if (!container) return;

      if (profiles.length === 0) {
        container.innerHTML = `<div class="p-4 text-center text-slate-400 text-sm">Нет сохранённых записей</div>`;
        return;
      }

      container.innerHTML = profiles.map(p => `
        <div class="flex items-center justify-between p-3 bg-slate-50 hover:bg-amber-50 rounded-xl border border-slate-200 transition-colors group">
          <button type="button" class="btn-load-profile text-left flex-grow mr-2" data-id="${p.id}">
            <div class="font-bold text-slate-900 group-hover:text-amber-900 text-sm">${p.nameTag}</div>
            <div class="text-xs text-slate-500 mt-0.5">Дата рожд: ${p.birthDate || '—'} | Текущая: ${p.calcDate || '—'}</div>
          </button>
          <button type="button" class="btn-delete-profile text-slate-400 hover:text-red-600 p-2 rounded-lg transition-colors" data-id="${p.id}" title="Удалить профиль">
            <i class="fa-solid fa-trash-can text-sm"></i>
          </button>
        </div>
      `).join('');

      // Event listeners for profile items
      container.querySelectorAll(".btn-load-profile").forEach(btn => {
        btn.addEventListener("click", () => {
          const pid = btn.getAttribute("data-id");
          const target = profiles.find(p => p.id === pid);
          if (target) {
            setInputsToDOM(target);
            renderUI();
            showToast(`Загружен профиль: ${target.nameTag}`, "success");
            closeProfilesModal();
          }
        });
      });

      container.querySelectorAll(".btn-delete-profile").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const pid = btn.getAttribute("data-id");
          deleteProfileRecord(pid);
        });
      });
    }

    // --- MODAL CONTROLS ---
    function openProfilesModal() {
      const modal = document.getElementById("profiles-modal");
      if (modal) modal.classList.remove("hidden");
    }
    function closeProfilesModal() {
      const modal = document.getElementById("profiles-modal");
      if (modal) modal.classList.add("hidden");
    }

    // --- INITIALIZATION ---
    document.addEventListener("DOMContentLoaded", async () => {
      // 1. Initialize Firebase Auth Safely
      try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);

        if (initialAuthToken) {
          await signInWithCustomToken(auth, initialAuthToken);
        } else {
          await signInAnonymously(auth);
        }
        currentUser = auth.currentUser;
      } catch (err) {
        console.warn("Firebase initialization bypassed, operating offline/local:", err);
      }

      // 2. Load profiles
      loadAllProfiles();

      // 3. Render initial calculator state
      renderUI();

      // 4. Input Listeners (Instant Re-calculation)
      const inputIds = [
        "inp-name-ru", "inp-name-en", "inp-name-uk", "inp-birth-date",
        "inp-calc-date", "inp-year-m3", "inp-year-m5", "inp-month-s3",
        "inp-month-u3", "inp-day-x3", "inp-day-x4", "inp-day-z3"
      ];

      inputIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.addEventListener("input", renderUI);
          el.addEventListener("change", renderUI);
        }
      });

      // Synchronize Dates Button
      document.getElementById("btn-sync-dates").addEventListener("click", () => {
        const mainBirth = document.getElementById("inp-birth-date").value;
        if (mainBirth) {
          document.getElementById("inp-year-m5").value = mainBirth;
          document.getElementById("inp-day-z3").value = mainBirth;
          renderUI();
          showToast("Все даты рождения синхронизированы", "success");
        }
      });

      // Reset Inputs Button
      document.getElementById("btn-reset-inputs").addEventListener("click", () => {
        setInputsToDOM(DEFAULT_PROFILES[0]);
        renderUI();
        showToast("Сброшено к эталону «Екатерина»");
      });

      // Save Current Profile Button
      document.getElementById("btn-save-current-profile").addEventListener("click", () => {
        const currentInputs = getInputsFromDOM();
        const defaultName = currentInputs.nameRu || "Профиль " + new Date().toLocaleDateString('ru-RU');
        const customName = prompt("Введите имя для этого профиля:", defaultName);
        if (customName !== null && customName.trim() !== "") {
          const newProfile = {
            id: "prof_" + Date.now(),
            nameTag: customName.trim(),
            ...currentInputs,
            updatedAt: new Date().toISOString()
          };
          saveProfileRecord(newProfile);
        }
      });

      // Tabs Navigation
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".tab-btn").forEach(b => {
            b.classList.remove("active", "border-amber-500", "text-amber-600", "bg-white", "font-semibold");
            b.classList.add("text-slate-600", "border-transparent", "font-medium");
          });
          btn.classList.add("active", "border-amber-500", "text-amber-600", "bg-white", "font-semibold");
          btn.classList.remove("text-slate-600", "border-transparent");
          activeTab = btn.getAttribute("data-tab");
          renderUI();
        });
      });

      // Profiles Modal Trigger
      document.getElementById("btn-open-profiles").addEventListener("click", openProfilesModal);
      document.getElementById("btn-close-profiles").addEventListener("click", closeProfilesModal);
      document.getElementById("btn-close-profiles-footer").addEventListener("click", closeProfilesModal);

      // Copy Report Action
      document.getElementById("btn-copy-report").addEventListener("click", async () => {
        const out = document.getElementById("output-content");
        if (!out) return;
        try {
          await navigator.clipboard.writeText(out.innerText.trim());
          showToast("Текст текущего раздела скопирован!", "success");
        } catch (e) {
          const textAttr = out.innerText.trim();
          const textArea = document.createElement("textarea");
          textArea.value = textAttr;
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
          showToast("Текст скопирован в буфер обмена!", "success");
        }
      });

      // Print / PDF Action
      document.getElementById("btn-print-report").addEventListener("click", () => {
        window.print();
      });
    });
  </script>
</body>
